[project]
name = "goit-pythonweb-hw-08"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "black>=26.3.1",
    "cryptography>=47.0.0",
    "fastapi[standard]>=0.136.1",
    "greenlet>=3.4.0",
    "orjson>=3.11.8",
    "pyjwt>=2.12.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.20.0",
    "slowapi>=0.1.9",
    "sphinx>=9.1.0",
    "sqlalchemy>=2.0.49",
    "uvloop>=0.22.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=src --cov-report=html --cov-report=term-missing --cov-fail-under=75"
asyncio_mode = "auto"
